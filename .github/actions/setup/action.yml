name: 'Setup environment'
description: 'Set up mise tools (Python, Node.js, ...) and install project dependencies'

inputs:
  python-version:
    description: 'Python version to use instead of the one in mise.toml'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - if: inputs.python-version != ''
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      # The flavor stops mise from picking the free-threaded build, which it cannot install.
      run: |
        echo "MISE_PYTHON_VERSION=$PYTHON_VERSION" >> "$GITHUB_ENV"
        echo "MISE_PYTHON_PRECOMPILED_FLAVOR=install_only_stripped" >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      with:
        path: python/.venv
        key: poetry-venv-v1-${{ runner.os }}-py${{ inputs.python-version || 'default' }}-${{ hashFiles('python/poetry.lock') }}
        restore-keys: poetry-venv-v1-${{ runner.os }}-py${{ inputs.python-version || 'default' }}-
    - uses: actions/cache@v4
      with:
        path: ~/.cache/yarn
        key: yarn-cache-v1-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
        restore-keys: yarn-cache-v1-${{ runner.os }}-
    - uses: jdx/mise-action@5cb1df66ed5e1fb3c670ea0b62fd17a76979826a
      with:
        version: 2025.7.1
